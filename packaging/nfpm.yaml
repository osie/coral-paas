name: coralctl
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: OSIE <support@osie.io>
vendor: OSIE
homepage: https://github.com/osie/coral-paas
license: Proprietary
description: |-
  Operator CLI for Coral.
  Builds, upgrades and operates a Coral service hub on an OpenStack cloud,
  which runs managed databases and Kubernetes clusters for the cloud's
  projects. k0sctl and helm are embedded.
contents:
  - src: dist/package/coralctl
    dst: /usr/bin/coralctl
    file_info:
      mode: 0o755
  - src: dist/THIRD_PARTY_NOTICES.txt
    dst: /usr/share/doc/coralctl/THIRD_PARTY_NOTICES.txt
    file_info:
      mode: 0o644
  - src: dist/completions/coralctl.bash
    dst: /usr/share/bash-completion/completions/coralctl
    file_info:
      mode: 0o644
  - src: dist/completions/_coralctl
    dst: /usr/share/zsh/vendor-completions/_coralctl
    packager: deb
    file_info:
      mode: 0o644
  - src: dist/completions/_coralctl
    dst: /usr/share/zsh/site-functions/_coralctl
    packager: rpm
    file_info:
      mode: 0o644
  - src: dist/completions/coralctl.fish
    dst: /usr/share/fish/vendor_completions.d/coralctl.fish
    file_info:
      mode: 0o644
